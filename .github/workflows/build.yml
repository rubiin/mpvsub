name: Build executables

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Linux: PyInstaller bundle + system GTK4/libadwaita (gi bindings come
  # from the distro packages, so the bundle needs GTK4 installed).
  # ------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the system python3 (3.12 on ubuntu-latest) — it is the one that
      # sees the apt-installed gi bindings in /usr/lib/python3/dist-packages.
      # actions/setup-python would install a separate interpreter that never
      # sees them, breaking `import gi` inside the venv.
      - name: Install GTK4 / libadwaita bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-venv xvfb

      - name: Create venv and install build deps
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyinstaller guessit

      - name: Build with PyInstaller
        run: .venv/bin/pyinstaller --noconfirm packaging/mpvsub.spec

      - name: Smoke-test the bundle (xvfb)
        run: |
          # GitHub's default bash runs with -e, which would abort on the
          # (expected) 124 from timeout before we can inspect it — so
          # disable errexit around the run and re-enable after.
          set +e
          GTK_A11Y=none timeout 8 xvfb-run -a ./dist/mpvsub/mpvsub
          code=$?
          set -e
          if [ "$code" = "124" ]; then
            echo "bundle stayed running under xvfb (OK)"
          else
            echo "bundle exited early with code $code"
            exit 1
          fi

      - name: Package zip
        run: .venv/bin/python -m zipfile -c mpvsub-linux-x86_64.zip dist/mpvsub

      - uses: actions/upload-artifact@v4
        with:
          name: mpvsub-linux-x86_64
          path: mpvsub-linux-x86_64.zip

  # ------------------------------------------------------------------
  # Windows: self-contained bundle from the MSYS2 MINGW64 GTK4 stack
  # (python + pygobject + gtk4 + libadwaita built for Windows).
  # ------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-gobject

      # PyInstaller has no MSYS2 pacman package — install it with pip
      - name: Install Python deps
        shell: msys2 {0}
        run: pip install pyinstaller guessit

      - name: Build with PyInstaller
        shell: msys2 {0}
        run: python -m PyInstaller --noconfirm packaging/mpvsub.spec

      - name: Smoke-test the bundle
        shell: msys2 {0}
        run: |
          ls -la dist/mpvsub
          ./dist/mpvsub/mpvsub.exe &
          pid=$!
          sleep 8
          if kill -0 $pid 2>/dev/null; then
            echo "bundle stayed running (OK)"
            kill $pid
          else
            echo "bundle exited early"
            exit 1
          fi

      - name: Package zip
        shell: msys2 {0}
        run: python -m zipfile -c mpvsub-windows-x86_64.zip dist/mpvsub

      - uses: actions/upload-artifact@v4
        with:
          name: mpvsub-windows-x86_64
          path: mpvsub-windows-x86_64.zip

  # ------------------------------------------------------------------
  # Release: on version tags (v*), attach the built zips to a GitHub
  # Release. contents: write is scoped to this job only.
  # ------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mpvsub-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # skip if the release already exists (e.g. a re-run)
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && exit 0
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            mpvsub-linux-x86_64.zip mpvsub-windows-x86_64.zip
