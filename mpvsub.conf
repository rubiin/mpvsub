# Options for the mpvsub mpv script.
# Copy to ~/.config/mpv/script-opts/mpvsub.conf and edit.

# Key that opens the subtitle downloader popup.
key=CTRL+g

# Python interpreter to run the app. Use the venv python if you installed
# the dependencies in a virtualenv (see README).
#python=/home/you/mpvsub/.venv/bin/python3

# Absolute path to main.py. Default: next to this script (useful when the
# script lives in the repo folder, or when it sits in ~/.config/mpv/scripts
# point this at the repo).
#app=/home/you/mpvsub/main.py

# Extra CLI arguments passed to main.py (space separated), e.g. --debug.
#extra_args=
