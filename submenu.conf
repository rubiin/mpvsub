# submenu.conf — options for submenu.lua
#
# Copy to ~/.config/mpv/script-opts/submenu.conf to customize, or pass
# --script-opts=submenu-<option>=<value> on the command line.

# Key binding that opens the subtitle picker.
key=CTRL+s

# Comma separated IETF language codes. 'l' cycles through these in the picker.
languages=en

# Comma separated subliminal providers.
providers=opensubtitlescom,podnapisi,subtis,tvsubtitles

# Absolute path to sub_helper.py. Empty = look next to this script,
# then on PATH.
helper=

# Directory downloaded subtitles are saved to. Empty = same directory
# as the video.
download_dir=

# Encoding used when saving subtitle files.
encoding=utf-8

# Debugging: dump the OSD overlay (ASS) to this file on every render.
# Leave empty to disable.
debug_osd_file=

# Maximum number of search results to show.
max_results=100

# Panel size as a fraction of the screen.
panel_width=0.64
panel_height=0.74

# UI colors (RRGGBB).
accent=E6A23C
bg=0F1115
